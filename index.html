let currentQuiz=[];
let current=0;
let score=0;
let answered=false;

function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function startGame(level){
 if(level==="all"){
   currentQuiz=shuffle([...quizData]);
   document.getElementById("level").textContent="全100問";
 }else{
   currentQuiz=shuffle(quizData.filter(q=>q.level===level));
   document.getElementById("level").textContent=
     level==="easy"?"初級":
     level==="normal"?"中級":"上級";
 }

 current=0;
 score=0;
 document.getElementById("score").textContent=0;
 document.getElementById("total").textContent=currentQuiz.length;

 document.getElementById("menu").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");

 loadQuestion();
}

function loadQuestion(){
 answered=false;
 document.getElementById("result").textContent="";
 document.getElementById("comment").textContent="";
 document.getElementById("nextBtn").classList.add("hidden");

 const q=currentQuiz[current];
 document.getElementById("count").textContent=current+1;
 document.getElementById("question").textContent=q.q;

 const choices=document.getElementById("choices");
 choices.innerHTML="";

 shuffle([...q.c]).forEach(choice=>{
   const btn=document.createElement("button");
   btn.textContent=choice;
   btn.className="choice";
   btn.onclick=()=>checkAnswer(btn,choice);
   choices.appendChild(btn);
 });
}

function checkAnswer(button,selected){
 if(answered)return;
 answered=true;

 const q=currentQuiz[current];
 const buttons=document.querySelectorAll(".choice");

 buttons.forEach(btn=>{
   btn.disabled=true;
   if(btn.textContent===q.a)btn.classList.add("correct");
 });

 if(selected===q.a){
   score+=10;
   document.getElementById("score").textContent=score;
   document.getElementById("result").textContent="正解！";
 }else{
   button.classList.add("wrong");
   document.getElementById("result").textContent="不正解…";
 }

 document.getElementById("comment").textContent=q.e;

 if(current<currentQuiz.length-1){
   document.getElementById("nextBtn").classList.remove("hidden");
 }else{
   finishGame();
 }
}

function nextQuestion(){
 current++;
 loadQuestion();
}

function finishGame(){
 const max=currentQuiz.length*10;
 const rate=Math.round(score/max*100);

 document.getElementById("question").textContent="ゲーム終了！";
 document.getElementById("choices").innerHTML="";
 document.getElementById("result").textContent=
 rate===100?"🏆 AI博士！":
 rate>=80?"🎉 AI上級者！":
 rate>=50?"👍 AI理解中！":"📚 もう一度挑戦！";

 document.getElementById("comment").textContent=
 `スコア ${score} / ${max} 点（正答率 ${rate}%）`;

 document.getElementById("restartBtn").classList.remove("hidden");
}

function restartGame(){
 location.reload();
}
</script>
